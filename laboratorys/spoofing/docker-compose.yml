services:
  # ─── Жертва ──────────────────────────────────────────────
  victim:
    image: alpine:latest
    container_name: spoof-victim
    command: >
      sh -c "
        apk add --no-cache iproute2 tcpdump curl bind-tools;
        ip route add default via 172.28.0.1 || true;
        sleep infinity
      "
    volumes:
      - ./victim_resolve.conf:/etc/resolv.conf:ro
    networks:
      spoof-net:
        ipv4_address: 172.28.0.10
    cap_add:
      - NET_RAW
    restart: unless-stopped

  # ─── Цель ────────────────────────────────────────────────
  target:
    image: nginx:alpine
    container_name: spoof-target
    networks:
      spoof-net:
        ipv4_address: 172.28.0.20
    restart: unless-stopped

  # ─── Атакующий ───────────────────────────────────────────
  attacker:
    build: .
    container_name: spoof-attacker
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      spoof-net:
        ipv4_address: 172.28.0.66
    volumes:
      - .:/app
    working_dir: /app
    command: sleep infinity
    restart: unless-stopped

  # ─── DNS-сервер ──────────────────────────────────────────
  dns-server:
    image: alpine:latest
    container_name: spoof-dns
    command: >
      sh -c "
        apk add --no-cache dnsmasq;
        dnsmasq -k --log-queries --address=/example.com/93.184.216.34;
      "
    networks:
      spoof-net:
        ipv4_address: 172.28.0.53
    restart: unless-stopped

networks:
  spoof-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1