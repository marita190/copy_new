rules:
  - id: sqli-template-string-query
    patterns:
      - pattern: |
          $DB.query(`...${$INPUT}...`)
    message: >
      SQL-инъекция: запрос собирается через шаблонную строку с интерполяцией.
      Используйте параметризованные запросы.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      category: sqli
      owasp: A03:2021
      cwe: CWE-89

  - id: idor-findone-no-owner-check
    patterns:
      - pattern: |
          $MODEL.findOne({ where: { id: $REQ.params.id } })
      - pattern-not: |
          $MODEL.findOne({ where: { id: $REQ.params.id, UserId: $REQ.user.id } })
    message: >
      Возможен IDOR: объект загружается по req.params.id без проверки
      владельца. Убедитесь, что текущий пользователь имеет право на объект.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      category: broken-access-control
      owasp: A01:2021
      cwe: CWE-639

  - id: hardcoded-secret
    patterns:
      - pattern-regex: |
          (password|secret|api_key|apikey|token)\s*[:=]\s*['"][^'"]{8,}['"]
    message: >
      Возможен hardcoded secret в коде. Используйте переменные окружения
      или хранилище секретов.
    severity: WARNING
    languages: [javascript, typescript, python]
    metadata:
      category: crypto
      owasp: A02:2021
      cwe: CWE-798

  - id: python-lfi-user-controlled-module
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      LFI: a request parameter reaches local Python module inclusion.
      Select a trusted module using an allowlist instead of a user-supplied path.
    pattern-sources:
      - pattern: request.args.get(...)
    pattern-sinks:
      - pattern: runpy.run_path(...)
    metadata:
      category: security
      vulnerability: LFI
      cwe: CWE-22

  - id: python-rfi-remote-code-execution
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      RFI: content from an HTTP response is executed as Python code.
      Never execute untrusted remote content.
    pattern-sources:
      - pattern: requests.get(...)
    pattern-sinks:
      - pattern: exec($CODE, ...)
        focus-metavariable: $CODE
    metadata:
      category: security
      vulnerability: RFI
      cwe: CWE-95
